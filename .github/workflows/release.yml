name: Release

# After CI succeeds on a push to master, semantic-release tags, updates
# CHANGELOG.md, publishes @thoughtpivot/scribe, and opens a GitHub release.
#
# npm trusted publishing (OIDC) for this repo, workflow release.yml, and no
# environment. Do not set NPM_TOKEN or NODE_AUTH_TOKEN: a token overrides
# OIDC and fails with EOTP. id-token: write is how npm authenticates.
on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]

concurrency:
    group: scribe-semantic-release
    cancel-in-progress: false

permissions:
    contents: write
    id-token: write

jobs:
    release:
        name: semantic-release
        if: >
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'master'
        runs-on: ubuntu-latest
        env:
            GIT_AUTHOR_NAME: Dan Stephenson
            GIT_AUTHOR_EMAIL: ispyhumanfly@gmail.com
            GIT_COMMITTER_NAME: Dan Stephenson
            GIT_COMMITTER_EMAIL: ispyhumanfly@gmail.com
        steps:
            - name: Checkout tested commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            # Trusted publishing needs npm >= 11.5.1. Node 22's bundled npm is older.
            - name: Upgrade npm
              run: |
                  npm i -g npm@latest
                  npm --version
                  node --input-type=module -e "
                  const [maj, min, pat] = process.argv[1].split('.').map(Number);
                  const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
                  if (!ok) {
                    console.error('npm ' + process.argv[1] + ' is older than 11.5.1');
                    process.exit(1);
                  }
                  " "$(npm --version)"

            - name: Install
              run: npm ci

            # conventionalcommits@10 requires conventional-changelog-writer@9.
            # release-notes-generator@14 and commit-analyzer@13 depend on
            # writer@8 (their tests use conventionalcommits@9.3.1). Preset 10
            # fails in generateNotes with that writer.
            - name: Install semantic-release
              run: |
                  npm install --prefix "${RUNNER_TEMP}/scribe-release" --save-exact \
                    semantic-release@25.0.9 \
                    @semantic-release/changelog@7.0.0 \
                    @semantic-release/commit-analyzer@13.0.1 \
                    @semantic-release/git@11.0.1 \
                    @semantic-release/github@12.0.10 \
                    @semantic-release/npm@13.2.0 \
                    @semantic-release/release-notes-generator@14.1.1 \
                    conventional-changelog-conventionalcommits@9.3.1

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # A token in the environment or npmrc overrides OIDC and hits EOTP.
                  unset NPM_TOKEN NODE_AUTH_TOKEN || true
                  if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
                    sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG}" || true
                  fi
                  "${RUNNER_TEMP}/scribe-release/node_modules/.bin/semantic-release"
